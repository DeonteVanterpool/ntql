subjects:
  - name: title
    aliases:
      - name
    validVerbs:
      - name: startswith
        aliases: []
      - name: endswith
        aliases: []
      - name: contains
        aliases: []
      - name: equals
        aliases:
          - eq
    validTypes:
      - string
    table: tasks
    column: title

  - name: due
    aliases:
      - deadline
    validVerbs:
      - name: before
        aliases: []
      - name: after
        aliases: []
      - name: equals
        aliases: []
    validTypes:
      - date
      - dateTime
    table: tasks
    column: due_date

  - name: status
    aliases:
      - state
    validVerbs:
      - name: equals
        aliases:
          - eq
    validTypes:
      - string
    table: tasks
    column: status

  - name: priority
    aliases: []
    validVerbs:
      - name: equals
        aliases:
          - eq
      - name: lessthan
        aliases:
          - lt
      - name: greaterthan
        aliases:
          - gt
      - name: lessthanorequal
        aliases:
          - lte
      - name: greaterthanorequal
        aliases:
          - gte
    validTypes:
      - int
    table: tasks
    column: priority

  - name: project
    aliases: []
    validVerbs:
      - name: equals
        aliases:
          - eq
    validTypes:
      - string
    table: projects
    column: name

  - name: createdAt
    aliases: []
    validVerbs:
      - name: before
        aliases: []
      - name: after
        aliases: []
      - name: equals
        aliases: []
    validTypes:
      - date
      - dateTime
    table: tasks
    column: created_at

  - name: updatedAt
    aliases: []
    validVerbs:
      - name: before
        aliases: []
      - name: after
        aliases: []
      - name: equals
        aliases: []
    validTypes:
      - date
      - dateTime
    table: tasks
    column: updated_at

  - name: completedAt
    aliases: []
    validVerbs:
      - name: before
        aliases: []
      - name: after
        aliases: []
      - name: equals
        aliases: []
    validTypes:
      - date
      - dateTime
    table: tasks
    column: completed_at

  - name: createdBy
    aliases: []
    validVerbs:
      - name: equals
        aliases:
          - eq
    validTypes:
      - string
    table: tasks
    column: created_by

  - name: tag
    aliases: []
    validVerbs:
      - name: equals
        aliases:
          - eq
    validTypes:
      - tag
    table: tags
    column: name

fieldTypes:
  dateTypes:
    - due_date
    - do_date
    - created_at
    - updated_at
    - completed_at
  boolTypes:
    - hide_from_calendar
    - all_day
    - completed
  numericTypes:
    - priority
  stringTypes:
    - title
    - description

tables:
  - name: tasks
    primaryKey: id
  - name: projects
    primaryKey: id
  - name: tags
    primaryKey: id
  - name: task_tags
    primaryKey: task_id

joins:
  - fromTable: tasks
    toTable: projects
    fromKey: project_id
    toKey: id
  - fromTable: tasks
    toTable: task_tags
    fromKey: id
    toKey: task_id
  - fromTable: task_tags
    toTable: tags
    fromKey: tag_id
    toKey: id
